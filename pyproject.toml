[project]
name = "retroloop"
version = "0.1.0"
description = "Weekly team feedback and retrospective tool"
requires-python = ">=3.14"
dependencies = [
    "django==6.0",
    "psycopg[binary]==3.3",
    "gunicorn==26.0",
    "dj-database-url==3.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1",
    "pytest-django==4.12",
    "ruff==0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
